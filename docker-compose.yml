services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-comet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comet_secure_2024}
      POSTGRES_DB: ${POSTGRES_DB:-comet_cedelia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comet} -d ${POSTGRES_DB:-comet_cedelia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-comet}:${POSTGRES_PASSWORD:-comet_secure_2024}@db:5432/${POSTGRES_DB:-comet_cedelia}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-defaultsecret_changeme_in_production}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      AXONAUT_API_KEY: ${AXONAUT_API_KEY:-}
      AXONAUT_API_URL: ${AXONAUT_API_URL:-https://axonaut.com/api/v2}
      CRON_SECRET: ${CRON_SECRET:-comet_cron_secret_2024}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Comet}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - backup_data:/app/backups
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

volumes:
  postgres_data:
  backup_data:
  uploads_data:
